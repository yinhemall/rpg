<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: #111; touch-action: none; overflow: hidden; height: 100vh; }
        #game-view { width: 100vw; height: 70vh; position: relative; background: #222; }
        #player { width: 40px; height: 40px; background: cyan; position: absolute; left: 50px; top: 50px; border-radius: 5px; }
        #joystick-base { width: 120px; height: 120px; background: rgba(255,255,255,0.3); border-radius: 50%; position: fixed; bottom: 50px; left: 50px; }
    </style>
</head>
<body>

<div id="game-view"><div id="player"></div></div>
<div id="joystick-base"></div>

<script>
    const supabase = supabase.createClient(
        'https://njxwgiqhlwkybtmbmvto.supabase.co', 
        'sb_publishable_aAhb31EsthrP6PTDOk4dgw_Ww_y-orM'
    );
    
    const player = document.getElementById('player');
    const base = document.getElementById('joystick-base');
    let px = 50, py = 50;

    // 直接綁定在搖桿上，避免全域干擾
    base.addEventListener('touchmove', (e) => {
        e.preventDefault();
        let touch = e.touches[0];
        
        // 根據手指中心位置移動角色
        px = touch.clientX - 20;
        py = touch.clientY - 20;
        
        player.style.left = px + 'px';
        player.style.top = py + 'px';
    }, {passive: false});

    base.addEventListener('touchend', async () => {
        // 結束時存檔
        await supabase.from('player_stars').upsert({ id: 'player1', x: Math.floor(px), y: Math.floor(py) });
    });
</script>
</body>
</html>
