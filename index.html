<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Game</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, canvas { width: 100%; height: 100vh; margin: 0; padding: 0; overflow: hidden; touch-action: none; }
        #debug { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.5); z-index: 100; pointer-events: none; }
    </style>
</head>
<body>
    <div id="debug">連線中...</div>
    <canvas id="renderCanvas"></canvas>
    <script>
        const debug = document.getElementById('debug');
        const supabase = supabase.createClient(
            'https://njxwgiqhlwkybtmbmvto.supabase.co', 
            'Sb_publishable_aAhb31EsthrP6PTDOk4dgw_Ww_y-orM'
        );

        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        
        new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/3, 10, BABYLON.Vector3.Zero(), scene).attachControl(canvas, false);
        new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

        BABYLON.SceneLoader.ImportMesh("", "./", "minecraft.glb", scene, (meshes) => {
            let player = meshes[0];
            debug.innerText = "連線成功！";

            // 觸發簡單測試
            supabase.from('player_stars').select('*').limit(1).then(res => {
                if(res.error) debug.innerText = "表名稱錯誤: " + res.error.message;
                else debug.innerText = "已連線至 player_stars";
            });
        });

        engine.runRenderLoop(() => scene.render());
    </script>
</body>
</html>
