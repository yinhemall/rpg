<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Game</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, canvas { width: 100%; height: 100vh; margin: 0; padding: 0; overflow: hidden; touch-action: none; }
        #debug { position: absolute; top: 10px; left: 10px; color: yellow; background: black; z-index: 100; font-size: 20px; }
    </style>
</head>
<body>
    <div id="debug">啟動中...</div>
    <canvas id="renderCanvas"></canvas>
    <script>
        const debug = document.getElementById('debug');
        
        // 檢查是否成功進入腳本
        debug.innerText = "腳本運行中...";
        
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        
        new BABYLON.ArcRotateCamera("cam", 0, 1, 5, BABYLON.Vector3.Zero(), scene).attachControl(canvas, false);
        new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

        // 載入模型
        BABYLON.SceneLoader.ImportMesh("", "./", "minecraft.glb", scene, 
            () => { debug.innerText = "模型載入成功！"; },
            null,
            (s, m) => { debug.innerText = "錯誤: " + m; }
        );

        engine.runRenderLoop(() => scene.render());
    </script>
</body>
</html>
