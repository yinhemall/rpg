<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Game</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, canvas { width: 100%; height: 100vh; margin: 0; padding: 0; overflow: hidden; }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <script>
        // 初始化 Babylon.js
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        
        new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/3, 10, BABYLON.Vector3.Zero(), scene).attachControl(canvas, true);
        new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

        // 載入模型
        BABYLON.SceneLoader.ImportMesh("", "./", "minecraft.glb", scene, (meshes) => {
            console.log("模型已載入");
        });

        // Supabase 先暫時註解掉，排除是因為連線失敗導致的白屏
        // const supabase = supabase.createClient('https://njxwgiqhlwkybtmbmvto.supabase.co', 'Sb_publishable_aAhb31EsthrP6PTDOk4dgw_Ww_y-orM');

        engine.runRenderLoop(() => scene.render());
    </script>
</body>
</html>
