<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style> body { margin: 0; background-color: #222; overflow: hidden; } </style>
</head>
<body>
<script>
const config = {
    type: Phaser.AUTO,
    width: 800, height: 600,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: {
        create: function() {
            this.cameras.main.setBackgroundColor('#2d2d2d');
            
            // 1. 建立玩家
            this.player = this.add.circle(400, 300, 40, 0x00ffff);
            
            // 2. 建立一個觸控區域 (讓你知道哪裡可以按)
            this.inputZone = this.add.rectangle(400, 300, 800, 600, 0xffffff, 0.1).setInteractive();
            
            // 3. 移動邏輯：直接讓圓形跟隨手指
            this.input.on('pointermove', (p) => {
                if (p.isDown) {
                    this.player.x = p.x;
                    this.player.y = p.y;
                }
            });
        }
    }
};
new Phaser.Game(config);
</script>
</body>
</html>
