<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft RPG</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #222; }
        #renderCanvas { width: 100%; height: 100%; display: block; }
        #ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #111; padding: 25px; border: 1px solid #0ff; color: #fff; text-align: center; z-index: 100; border-radius: 15px; width: 85%; }
        input { display: block; margin: 10px auto; padding: 10px; width: 90%; background: #000; color: #fff; border: 1px solid #444; }
        button { padding: 10px 20px; margin: 5px; background: transparent; color: #0ff; border: 1px solid #0ff; cursor: pointer; }
        #joystick { position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; border: 2px solid #0ff; border-radius: 50%; display: none; z-index: 50; }
        #stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: white; border-radius: 50%; }
    </style>
</head>
<body>
    <div id="ui">
        <h3 id="ui-title">系統登入</h3>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="密碼">
        <input type="text" id="nickname" placeholder="暱稱" style="display:none;">
        <button id="main-btn" onclick="handleAction()">登入</button>
        <button onclick="toggleMode()" id="toggle-btn">切換註冊</button>
    </div>
    <div id="joystick"><div id="stick"></div></div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.2, 0.2, 0.2, 1);
        
        // 燈光與地板 (背景色調設為可見)
        const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
        light.intensity = 0.8; 
        const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 200, height: 200}, scene);
        const gMat = new BABYLON.StandardMaterial("gMat", scene);
        gMat.diffuseColor = new BABYLON.Color3(0.5, 0.5, 0.5); // 設為灰色，確保看得到
        ground.material = gMat;

        let player = null, anims = {}, currentAnim, moveX = 0, moveZ = 0, isSignUp = false;
        const sb = supabase.createClient('https://njxwgiqhlwkybtmbmvto.supabase.co', 'sb_publishable_aAhb31EsthrP6PTDOk4dgw_Ww_y-orM', { auth: { persistSession: false } });

        function toggleMode() {
            isSignUp = !isSignUp;
            document.getElementById('ui-title').innerText = isSignUp ? "系統註冊" : "系統登入";
            document.getElementById('main-btn').innerText = isSignUp ? "註冊" : "登入";
            document.getElementById('nickname').style.display = isSignUp ? "block" : "none";
        }

        async function handleAction() {
            if (player) return;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                let res = isSignUp ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
                if (res.error) throw res.error;
                document.getElementById('ui').style.display = 'none';
                document.getElementById('joystick').style.display = 'block';
                loadModel();
            } catch (err) { alert(err.message); }
        }

        function loadModel() {
            BABYLON.SceneLoader.ImportMesh("", "./", "minecraft.glb", scene, (meshes, _, __, animationGroups) => {
                player = meshes[0];
                player.scaling = new BABYLON.Vector3(2, 2, 2);
                player.position = new BABYLON.Vector3(0, 1, 0);

                // 在載入完成後才建立相機
                const camera = new BABYLON.FollowCamera("fCam", player.position.add(new BABYLON.Vector3(0, 10, -20)), scene);
                camera.lockedTarget = player;
                camera.radius = 20;
                camera.heightOffset = 8;
                camera.rotationOffset = 0;

                anims.walk = animationGroups.find(a => a.name === "walking_test");
                anims.still = animationGroups.find(a => a.name === "still_test");
                playAnim("still");
            });
        }

        function playAnim(name) {
            if (currentAnim === name || !anims[name]) return;
            if (anims[currentAnim]) anims[currentAnim].stop();
            anims[name].loopAnimation = true;
            anims[name].start(true);
            currentAnim = name;
        }

        const joystick = document.getElementById('joystick');
        joystick.addEventListener('touchmove', (e) => {
            const t = e.touches[0], r = joystick.getBoundingClientRect();
            moveX = Math.max(-1, Math.min(1, (t.clientX - (r.left + 60)) / 60));
            moveZ = Math.max(-1, Math.min(1, (t.clientY - (r.top + 60)) / 60));
            document.getElementById('stick').style.transform = `translate(${moveX*30}px, ${moveZ*30}px)`;
        });
        joystick.addEventListener('touchend', () => { 
            moveX = 0; moveZ = 0; 
            document.getElementById('stick').style.transform = `translate(0px, 0px)`; 
        });

        scene.onBeforeRenderObservable.add(() => {
            if (player) {
                if (Math.abs(moveX) > 0.1 || Math.abs(moveZ) > 0.1) {
                    player.rotation.y = Math.atan2(moveX, -moveZ);
                    player.position.x += moveX * 0.3;
                    player.position.z -= moveZ * 0.3;
                    playAnim("walk");
                } else {
                    playAnim("still");
                }
            }
        });

        engine.runRenderLoop(() => scene.render());
        window.addEventListener("resize", () => engine.resize());
    </script>
</body>
</html>
