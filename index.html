<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <style> body { margin: 0; background-color: #222; overflow: hidden; } </style>
</head>
<body>
<script>
// 設定你的 Supabase 資訊 (請勿隨意更動)
const SUPA_URL = 'https://njxwgiqhlwkybtmbmvto.supabase.co/rest/v1/player_stars';
const SUPA_KEY = 'sb_publishable_aAhb31EsthrP6PTDOk4dgw_Ww_y-orM';

const config = {
    type: Phaser.AUTO,
    width: 800, height: 600,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: {
        create: function() {
            this.cameras.main.setBackgroundColor('#2d2d2d');
            
            // 玩家角色
            this.player = this.add.circle(400, 300, 30, 0x00ffff);
            
            // 1. 自動讀取存檔 (如果讀取失敗，遊戲依然會正常顯示)
            fetch(SUPA_URL + "?id=eq.player1", {
                method: 'GET',
                headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY }
            })
            .then(res => res.json())
            .then(data => {
                if (data && data.length > 0) {
                    this.player.setPosition(data[0].x, data[0].y);
                }
            }).catch(() => console.log("暫時無法連線資料庫"));

            // 2. 建立搖桿
            this.base = this.add.circle(150, 450, 60, 0xffffff, 0.2);
            this.knob = this.add.circle(150, 450, 30, 0xffffff, 0.5);
            this.isDragging = false;

            // 3. 搖桿控制邏輯
            this.input.on('pointerdown', (p) => {
                if(Phaser.Math.Distance.Between(p.x, p.y, 150, 450) < 60) this.isDragging = true;
            });
            
            this.input.on('pointermove', (p) => {
                if (!this.isDragging) return;
                let angle = Phaser.Math.Angle.Between(150, 450, p.x, p.y);
                this.player.x += Math.cos(angle) * 5;
                this.player.y += Math.sin(angle) * 5;
                this.knob.setPosition(150 + Math.cos(angle)*30, 450 + Math.sin(angle)*30);
            });

            this.input.on('pointerup', () => {
                this.isDragging = false;
                this.knob.setPosition(150, 450);
                
                // 4. 自動存檔 (同樣使用不干擾遊戲的 fetch)
                fetch(SUPA_URL + "?id=eq.player1", {
                    method: 'PATCH',
                    headers: { 
                        'apikey': SUPA_KEY, 
                        'Authorization': 'Bearer ' + SUPA_KEY,
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({ x: Math.floor(this.player.x), y: Math.floor(this.player.y) })
                });
            });
        }
    }
};

new Phaser.Game(config);
</script>
</body>
</html>
