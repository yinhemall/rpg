<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #222; overflow: hidden; }
    </style>
</head>
<body>
<script>
// 使用 Phaser.AUTO 自動判斷渲染模式 (解決某些設備黑屏)
const config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
    },
    scene: {
        create: function() {
            this.cameras.main.setBackgroundColor('#4488aa'); // 改用藍色背景確認是否載入
            this.add.text(200, 250, '遊戲載入成功！', { fontSize: '40px', fill: '#fff' });
            console.log("Phaser 場景已建立");
        }
    }
};

window.onload = function() {
    new Phaser.Game(config);
};
</script>
</body>
</html>
