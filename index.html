<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>3D Minecraft RPG</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, canvas { width: 100%; height: 100vh; margin: 0; padding: 0; overflow: hidden; touch-action: none; }
        #ui { position: absolute; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.7); padding: 15px; z-index: 999; border-radius: 8px; font-family: sans-serif; }
    </style>
</head>
<body>
    <div id="ui">初始化中...</div>
    <canvas id="renderCanvas"></canvas>
    <script>
        const ui = document.getElementById('ui');
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        
        const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/3, 10, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);
        new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

        // 建立測試地板
        BABYLON.MeshBuilder.CreateGround("ground", {width: 20, height: 20}, scene);

        // Supabase 初始化
        const sbClient = supabase.createClient(
            'https://njxwgiqhlwkybtmbmvto.supabase.co', 
            'sb_publishable_aAhb31EsthrP6PTDOk4dgw_Ww_y-orM'
        );

        let player = null;
        let userId = null;
        let lastSaveTime = 0;

        // 匿名登入並載入模型
        sbClient.auth.signInAnonymously().then(res => {
            if(res.error) {
                ui.innerText = "登入失敗: " + res.error.message;
                return;
            }
            userId = res.data.user.id;
            ui.innerText = "已登入，載入模型中...";
            
            // 載入模型 (修正過的路徑設定)
            BABYLON.SceneLoader.ImportMesh("", "./", "minecraft.glb", scene, 
                (meshes) => {
                    player = meshes[0];
                    ui.innerText = "遊戲運行中，推動搖桿移動";
                },
                null,
                (scene, message) => {
                    ui.innerText = "模型載入錯誤: " + message;
                }
            );
        });

        const joystick = new BABYLON.VirtualJoystick(true);

        scene.registerBeforeRender(() => {
            if (player && joystick.pressed) {
                player.position.x += joystick.deltaPosition.x * 0.1;
                player.position.z += joystick.deltaPosition.y * 0.1;

                // 每 3 秒自動存檔
                if (Date.now() - lastSaveTime > 3000) {
                    lastSaveTime = Date.now();
                    sbClient.from('player_stars').upsert({
                        user_id: userId,
                        x: Math.round(player.position.x),
                        y: 0,
                        z: Math.round(player.position.z)
                    }).then(res => {
                        if (res.error) console.error("存檔失敗", res.error);
                    });
                }
            }
        });

        engine.runRenderLoop(() => scene.render());
    </script>
</body>
</html>
