<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft RPG</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; font-family: sans-serif; }
        #ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #111; padding: 25px; border: 1px solid #0ff; color: #fff; text-align: center; z-index: 100; border-radius: 15px; width: 80%; max-width: 300px; }
        input { display: block; margin: 10px auto; padding: 10px; width: 90%; background: #000; color: #fff; border: 1px solid #444; }
        button { padding: 10px 20px; margin: 5px; background: transparent; color: #0ff; border: 1px solid #0ff; cursor: pointer; }
        #joystick { position: absolute; bottom: 50px; left: 50px; width: 100px; height: 100px; border: 2px solid #0ff; border-radius: 50%; display: none; z-index: 50; }
        #stick { position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; background: white; border-radius: 50%; }
    </style>
</head>
<body>
    <div id="ui">
        <h3 id="ui-title">系統登入</h3>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="密碼">
        <input type="text" id="nickname" placeholder="設置暱稱" style="display:none;">
        <button id="main-btn" onclick="handleAction()">登入</button>
        <button onclick="toggleMode()" id="toggle-btn">切換註冊</button>
    </div>
    <div id="joystick"><div id="stick"></div></div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.1, 0.1, 0.1, 1);
        
        new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
        const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/3, 15, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);

        let player, anims = {}, currentAnim, moveX = 0, moveZ = 0, isSignUp = false;
        const sb = supabase.createClient('https://njxwgiqhlwkybtmbmvto.supabase.co', 'sb_publishable_aAhb31EsthrP6PTDOk4dgw_Ww_y-orM', { auth: { persistSession: false } });

        function toggleMode() {
            isSignUp = !isSignUp;
            document.getElementById('ui-title').innerText = isSignUp ? "系統註冊" : "系統登入";
            document.getElementById('main-btn').innerText = isSignUp ? "註冊" : "登入";
            document.getElementById('toggle-btn').innerText = isSignUp ? "切換登入" : "切換註冊";
            document.getElementById('nickname').style.display = isSignUp ? "block" : "none";
        }

        async function handleAction() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const nickname = document.getElementById('nickname').value;
            
            try {
                let res = isSignUp 
                    ? await sb.auth.signUp({ email, password, options: { data: { nickname } } }) 
                    : await sb.auth.signInWithPassword({ email, password });
                
                if (res.error) throw res.error;
                
                document.getElementById('ui').style.display = 'none';
                document.getElementById('joystick').style.display = 'block';
                loadModel();
            } catch (err) {
                alert("錯誤: " + err.message);
            }
        }

        function loadModel() {
            BABYLON.SceneLoader.ImportMesh("", "./", "minecraft.glb", scene, (meshes, _, __, animationGroups) => {
                player = meshes[0];
                player.scaling = new BABYLON.Vector3(2, 2, 2);
                camera.lockedTarget = player;
                anims.walk = animationGroups.find(a => a.name === "walking_test");
                anims.still = animationGroups.find(a => a.name === "still_test");
                playAnim("still");
            });
        }

        function playAnim(name) {
            if (currentAnim === name || !anims[name]) return;
            if (anims[currentAnim]) anims[currentAnim].stop();
            anims[name].loopAnimation = true;
            anims[name].start(true);
            currentAnim = name;
        }

        const joystick = document.getElementById('joystick');
        joystick.addEventListener('touchmove', (e) => {
            const t = e.touches[0], r = joystick.getBoundingClientRect();
            moveX = (t.clientX - (r.left + 50)) / 50;
            moveZ = (t.clientY - (r.top + 50)) / 50;
            document.getElementById('stick').style.transform = `translate(${moveX*20}px, ${moveZ*20}px)`;
        });
        joystick.addEventListener('touchend', () => { 
            moveX = 0; moveZ = 0; 
            document.getElementById('stick').style.transform = `translate(0px, 0px)`; 
        });

        scene.onBeforeRenderObservable.add(() => {
            if (player) {
                if (Math.abs(moveX) > 0.1 || Math.abs(moveZ) > 0.1) {
                    player.position.x += moveX * 0.2;
                    player.position.z -= moveZ * 0.2;
                    playAnim("walk");
                } else {
                    playAnim("still");
                }
            }
        });

        engine.runRenderLoop(() => scene.render());
        window.addEventListener("resize", () => engine.resize());
    </script>
</body>
</html>
