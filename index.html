<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: #111; touch-action: none; overflow: hidden; height: 100vh; }
        #game-view { width: 100vw; height: 70vh; position: relative; background: #222; }
        #player { width: 40px; height: 40px; background: cyan; position: absolute; left: 50px; top: 50px; border-radius: 5px; }
        /* 增加觸控區大小，確保 iOS 容易捕捉 */
        #joystick-base { width: 150px; height: 150px; background: rgba(255,255,255,0.2); border-radius: 50%; position: fixed; bottom: 30px; left: 30px; }
    </style>
</head>
<body>

<div id="game-view"><div id="player"></div></div>
<div id="joystick-base"></div>

<script>
    const supabase = supabase.createClient(
        'https://njxwgiqhlwkybtmbmvto.supabase.co', 
        'sb_publishable_aAhb31EsthrP6PTDOk4dgw_Ww_y-orM'
    );
    
    const player = document.getElementById('player');
    const base = document.getElementById('joystick-base');
    let px = 50, py = 50;

    // 關鍵修正：在觸控開始時就處理位置，且不使用 e.preventDefault() 以外的干擾
    function moveAt(pageX, pageY) {
        px = pageX - 20;
        py = pageY - 20;
        player.style.left = px + 'px';
        player.style.top = py + 'px';
    }

    base.addEventListener('touchmove', (e) => {
        // 確保手指移動時位置持續更新
        let touch = e.touches[0];
        moveAt(touch.clientX, touch.clientY);
    }, {passive: false});

    base.addEventListener('touchend', async () => {
        // 只有在手指離開時才執行網路請求，避免移動中卡頓
        await supabase.from('player_stars').upsert({ id: 'player1', x: Math.floor(px), y: Math.floor(py) });
    });
</script>
</body>
</html>
