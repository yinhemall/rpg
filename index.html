<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; touch-action: none; }
        #renderCanvas { width: 100vw; height: 100vh; display: block; }
        #ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #111; padding: 20px; border: 1px solid #0ff; color: #fff; z-index: 100; border-radius: 15px; width: 80%; text-align: center; }
        input { display: block; margin: 10px auto; padding: 10px; width: 90%; background: #222; color: #fff; border: 1px solid #444; }
        button { padding: 10px 20px; margin: 5px; color: #0ff; background: transparent; border: 1px solid #0ff; cursor: pointer; }
        #joystick { position: absolute; bottom: 50px; left: 50px; width: 100px; height: 100px; border: 2px solid #0ff; border-radius: 50%; display: none; z-index: 50; }
        #stick { position: absolute; top: 25px; left: 25px; width: 50px; height: 50px; background: white; border-radius: 50%; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">
        <h3 id="ui-title">系統登入</h3>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="密碼">
        <input type="text" id="nickname" placeholder="設置暱稱" style="display:none;">
        <button id="main-btn" onclick="processAuth()">登入</button>
        <button onclick="toggleMode()">切換註冊/登入</button>
    </div>
    <div id="joystick"><div id="stick"></div></div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.2, 0.2, 0.2, 1);
        new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

        const sb = supabase.createClient('https://njxwgiqhlwkybtmbmvto.supabase.co', 'sb_publishable_aAhb31EsthrP6PTDOk4dgw_Ww_y-orM', { auth: { persistSession: false } });
        let isSignUp = false, player = null;

        function toggleMode() {
            isSignUp = !isSignUp;
            document.getElementById('ui-title').innerText = isSignUp ? "系統註冊" : "系統登入";
            document.getElementById('main-btn').innerText = isSignUp ? "註冊" : "登入";
            document.getElementById('nickname').style.display = isSignUp ? "block" : "none";
        }

        async function processAuth() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const nick = document.getElementById('nickname').value;
            try {
                const { error } = isSignUp ? await sb.auth.signUp({ email, password, options: { data: { nickname: nick } } }) : await sb.auth.signInWithPassword({ email, password });
                if (error) throw error;
                document.getElementById('ui').style.display = 'none';
                document.getElementById('joystick').style.display = 'block';
                loadModel();
            } catch (err) { alert(err.message); }
        }

        function loadModel() {
            BABYLON.SceneLoader.ImportMesh("", "./", "minecraft.glb", scene, (meshes) => {
                player = meshes[0];
                player.scaling = new BABYLON.Vector3(2, 2, 2);
                const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/4, 20, player.position, scene);
                camera.attachControl(canvas, true);
                console.log("模型已載入");
            }, null, (s, m) => { alert("模型載入失敗，檔案路徑可能錯誤: " + m); });
        }

        engine.runRenderLoop(() => scene.render());
    </script>
</body>
</html>
