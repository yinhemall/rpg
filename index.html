<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }
        #joystick { position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.2); border: 2px solid white; }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <div id="joystick"></div>

    <script>
        const SUPA_URL = 'https://njxwgiqhlwkybtmbmvto.supabase.co/rest/v1/player_stars';
        const SUPA_KEY = 'sb_publishable_aAhb31EsthrP6PTDOk4dgw_Ww_y-orM';

        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);

        // 1. 場景配置
        const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/4, 20, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);
        const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
        const player = BABYLON.MeshBuilder.CreateBox("player", {size: 1}, scene);
        player.position.y = 0.5;

        // 2. 搖桿邏輯
        let moveX = 0, moveZ = 0;
        const joystick = document.getElementById("joystick");
        
        joystick.addEventListener("touchmove", (e) => {
            const rect = joystick.getBoundingClientRect();
            const touch = e.touches[0];
            moveX = (touch.clientX - rect.left - 60) / 60;
            moveZ = -(touch.clientY - rect.top - 60) / 60; // Z軸反向
        });

        joystick.addEventListener("touchend", () => {
            moveX = 0; moveZ = 0;
            // 存檔
            fetch(SUPA_URL + "?id=eq.player1", {
                method: 'PATCH',
                headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ x: player.position.x, y: player.position.z })
            });
        });

        // 3. 渲染迴圈
        engine.runRenderLoop(() => {
            player.position.x += moveX * 0.2;
            player.position.z += moveZ * 0.2;
            scene.render();
        });

        window.addEventListener("resize", () => engine.resize());
    </script>
</body>
</html>
