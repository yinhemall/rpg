<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style> body { margin: 0; background-color: #222; overflow: hidden; } </style>
</head>
<body>
<script>
const supabase = supabase.createClient(
    'https://njxwgiqhlwkybtmbmvto.supabase.co', 
    'sb_publishable_aAhb31EsthrP6PTDOk4dgw_Ww_y-orM'
);

const config = {
    type: Phaser.AUTO,
    width: 800, height: 600,
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    scene: {
        create: function() {
            this.cameras.main.setBackgroundColor('#2d2d2d');
            this.player = this.add.circle(400, 300, 30, 0x00ffff);
            
            // 搖桿
            this.base = this.add.circle(150, 450, 60, 0xffffff, 0.2);
            this.knob = this.add.circle(150, 450, 30, 0xffffff, 0.5);
            this.isDragging = false;

            // 非同步載入 (就算失敗也不會影響遊戲顯示)
            supabase.from('player_stars').select('*').eq('id', 'player1').single()
                .then(({data}) => { if(data) this.player.setPosition(data.x, data.y); })
                .catch(err => console.log("資料庫載入稍後再試"));

            // 觸控邏輯 (保持與之前一致)
            this.input.on('pointerdown', (p) => { if(Phaser.Math.Distance.Between(p.x, p.y, 150, 450) < 60) this.isDragging = true; });
            this.input.on('pointermove', (p) => {
                if (!this.isDragging) return;
                let angle = Phaser.Math.Angle.Between(150, 450, p.x, p.y);
                let dist = Math.min(Phaser.Math.Distance.Between(p.x, p.y, 150, 450), 60);
                this.knob.setPosition(150 + Math.cos(angle) * dist, 450 + Math.sin(angle) * dist);
                this.player.x += Math.cos(angle) * (dist / 10);
                this.player.y += Math.sin(angle) * (dist / 10);
            });
            this.input.on('pointerup', () => {
                this.isDragging = false;
                this.knob.setPosition(150, 450);
                supabase.from('player_stars').upsert({ id: 'player1', x: Math.floor(this.player.x), y: Math.floor(this.player.y) });
            });
        }
    }
};
new Phaser.Game(config);
</script>
</body>
</html>
