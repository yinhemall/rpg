<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>body, canvas { width: 100%; height: 100%; margin: 0; }</style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        // 設定一個亮色背景，方便看見
        scene.clearColor = new BABYLON.Color3(0.5, 0.7, 0.9);
        
        const camera = new BABYLON.ArcRotateCamera("cam", 0, 1, 10, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);
        
        new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
        
        // 生成一個測試方塊
        const box = BABYLON.MeshBuilder.CreateBox("testBox", {size: 2}, scene);
        
        engine.runRenderLoop(() => scene.render());
    </script>
</body>
</html>
