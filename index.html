<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Game</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: #222; }
        #debug { position: absolute; top: 10px; left: 10px; color: #0f0; background: rgba(0,0,0,0.8); padding: 10px; font-family: monospace; z-index: 999; }
    </style>
</head>
<body>
    <div id="debug">啟動中...</div>
    <canvas id="renderCanvas" style="width: 100%; height: 100vh; display: block;"></canvas>
    <script>
        const debug = document.getElementById('debug');
        
        try {
            // 1. 初始化 Babylon
            const canvas = document.getElementById("renderCanvas");
            const engine = new BABYLON.Engine(canvas, true);
            const scene = new BABYLON.Scene(engine);
            new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/3, 5, BABYLON.Vector3.Zero(), scene).attachControl(canvas, false);
            new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

            // 2. 正確初始化 Supabase (使用不同的變數名稱 sbClient 以避免命名衝突)
            debug.innerText = "正在初始化 Supabase...";
            const sbClient = supabase.createClient(
                'https://njxwgiqhlwkybtmbmvto.supabase.co', 
                'Sb_publishable_aAhb31EsthrP6PTDOk4dgw_Ww_y-orM'
            );
            
            // 3. 載入模型
            debug.innerText = "Supabase 初始化成功，載入模型...";
            BABYLON.SceneLoader.ImportMesh("", "./", "minecraft.glb", scene, (meshes) => {
                debug.innerText = "成功！開始遊戲";
                engine.runRenderLoop(() => scene.render());
            }, null, (s, m) => {
                debug.innerText = "模型載入失敗: " + m;
            });
            
        } catch (e) {
            debug.innerText = "程式錯誤: " + e.message;
        }
    </script>
</body>
</html>
