<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Minecraft RPG 遊戲</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
        canvas { width: 100%; height: 100vh; display: block; }
        #ui { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); background: #222; color: white; padding: 20px; border-radius: 10px; z-index: 10; text-align: center; }
        input { display: block; margin: 10px auto; color: black; padding: 5px; }
        button { cursor: pointer; padding: 10px 20px; margin: 5px; background: #555; color: white; border: none; border-radius: 5px; }
        #debug { position: absolute; top: 10px; left: 10px; color: yellow; z-index: 100; pointer-events: none; font-size: 14px; background: rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="ui">
        <h3>遊戲帳號管理</h3>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="密碼">
        <input type="text" id="nickname" placeholder="遊戲暱稱">
        <button onclick="handleAction('signIn')">登入</button>
        <button onclick="handleAction('signUp')">註冊</button>
    </div>

    <div id="debug"></div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        const debugDiv = document.getElementById("debug");

        const sb = supabase.createClient(
            'https://njxwgiqhlwkybtmbmvto.supabase.co', 
            'sb_publishable_aAhb31EsthrP6PTDOk4dgw_Ww_y-orM',
            { auth: { persistSession: false } }
        );

        async function handleAction(type) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const nickname = document.getElementById('nickname').value;
            
            let res;
            if (type === 'signUp') {
                res = await sb.auth.signUp({ email, password });
                if (!res.error) alert("註冊成功！");
            } else {
                res = await sb.auth.signInWithPassword({ email, password });
                if (!res.error) {
                    document.getElementById('ui').style.display = 'none';
                    startGame(); // 這裡現在應該會正常呼叫了
                }
            }
            if (res.error) alert("錯誤: " + res.error.message);
        }

        function startGame() {
            debugDiv.innerText = "開始載入...";
            
            // 1. 環境
            const ground = BABYLON.MeshBuilder.CreateGround("g", {width: 50, height: 50}, scene);
            ground.material = new BABYLON.StandardMaterial("m", scene);
            ground.material.diffuseColor = new BABYLON.Color3(0.2, 0.6, 0.2);
            new BABYLON.HemisphericLight("l", new BABYLON.Vector3(0, 1, 0), scene);
            
            const camera = new BABYLON.ArcRotateCamera("cam", 0, Math.PI/4, 20, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);

            // 2. 載入模型 (移除合併邏輯，改為直接遍歷處理，防止程式崩潰)
            BABYLON.SceneLoader.ImportMesh("", "./", "minecraft.glb", scene, (meshes) => {
                debugDiv.innerText = "模型載入成功，正在顯示...";
                meshes.forEach(m => {
                    m.position = new BABYLON.Vector3(0, 0, 0); // 確保在中心
                    m.isVisible = true; // 強制可見
                    if (!m.material) {
                        m.material = new BABYLON.StandardMaterial("mat", scene);
                        m.material.diffuseColor = new BABYLON.Color3(1, 0, 0); 
                    }
                });
            }, null, (s, m) => debugDiv.innerText = "載入錯誤: " + m);
        }

        engine.runRenderLoop(() => { scene.render(); });
        window.addEventListener("resize", () => engine.resize());
    </script>
</body>
</html>
