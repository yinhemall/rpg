<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Game</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, canvas { width: 100%; height: 100vh; margin: 0; padding: 0; overflow: hidden; touch-action: none; }
        #log { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.5); pointer-events: none; }
    </style>
</head>
<body>
    <div id="log">載入中...</div>
    <canvas id="renderCanvas"></canvas>
    <script>
        const logDiv = document.getElementById('log');
        
        // 1. 嘗試初始化 Supabase
        let supabase;
        try {
            supabase = supabase.createClient('https://njxwgiqhlwkybtmbmvto.supabase.co', 'Sb_publishable_aAhb31EsthrP6PTDOk4dgw_Ww_y-orM');
            logDiv.innerText = "Supabase 成功";
        } catch(e) {
            logDiv.innerText = "Supabase 失敗: " + e.message;
        }

        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        
        new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/3, 10, BABYLON.Vector3.Zero(), scene).attachControl(canvas, false);
        new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

        // 2. 載入模型
        BABYLON.SceneLoader.ImportMesh("", "./", "minecraft.glb", scene, (meshes) => {
            logDiv.innerText = "模型載入成功";
            window.player = meshes[0];
        }, null, (s, m) => {
            logDiv.innerText = "模型錯誤: " + m;
        });

        engine.runRenderLoop(() => scene.render());
    </script>
</body>
</html>
