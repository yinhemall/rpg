<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>測試畫面</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { width: 100%; height: 100vh; display: block; }
        #log { position: absolute; top: 10px; left: 10px; color: yellow; z-index: 100; font-size: 20px; }
    </style>
</head>
<body>
    <div id="log">測試開始...</div>
    <canvas id="renderCanvas"></canvas>
    <script>
        try {
            const canvas = document.getElementById("renderCanvas");
            const engine = new BABYLON.Engine(canvas, true);
            const scene = new BABYLON.Scene(engine);
            document.getElementById("log").innerText = "場景已建立";

            // 加入光源
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            
            // 建立地面
            const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 10, height: 10}, scene);
            const mat = new BABYLON.StandardMaterial("mat", scene);
            mat.diffuseColor = new BABYLON.Color3(0, 1, 0); // 強制綠色
            ground.material = mat;

            // 建立相機
            const camera = new BABYLON.ArcRotateCamera("cam", 0, Math.PI / 4, 20, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);

            engine.runRenderLoop(() => { scene.render(); });
            document.getElementById("log").innerText = "渲染中...";
        } catch (e) {
            document.getElementById("log").innerText = "錯誤: " + e.message;
        }
    </script>
</body>
</html>
