<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; touch-action: none; }
        #renderCanvas { width: 100vw; height: 100vh; display: block; }
        #ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #111; padding: 20px; border: 1px solid #0ff; color: #fff; z-index: 999; border-radius: 15px; width: 80%; text-align: center; }
        input { display: block; margin: 10px auto; padding: 10px; width: 90%; background: #222; color: #fff; border: 1px solid #444; }
        button { padding: 10px 20px; margin: 5px; color: #0ff; background: transparent; border: 1px solid #0ff; }
    </style>
</head>
<body>
    <div id="ui">
        <h3 id="ui-title">系統登入</h3>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="密碼">
        <input type="text" id="nickname" placeholder="暱稱" style="display:none;">
        <button id="main-btn" onclick="handleAuth()">登入</button>
        <button onclick="toggleMode()">切換註冊/登入</button>
    </div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.5, 0.7, 0.9, 1);
        
        const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
        light.intensity = 0.8; 
        light.specular = new BABYLON.Color3(0, 0, 0); 
        
        // --- 核心修正 1：相機初始設定 ---
        // 把目標設在 y=2 的位置 (角色頭部上方)
        const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/4, 20, new BABYLON.Vector3(0, 2, 0), scene);
        // camera.attachControl(canvas, true); // 【暫時取消】直接讓相機跟隨，不讓玩家自由旋轉

        const sb = supabase.createClient('https://njxwgiqhlwkybtmbmvto.supabase.co', 'sb_publishable_aAhb31EsthrP6PTDOk4dgw_Ww_y-orM', { auth: { persistSession: false } });
        let isSignUp = false;
        let leftJoystick, player;
        let modelLoaded = false; // 【核心修正 2：防止重複載入】

        function toggleMode() {
            isSignUp = !isSignUp;
            document.getElementById('ui-title').innerText = isSignUp ? "系統註冊" : "系統登入";
            document.getElementById('main-btn').innerText = isSignUp ? "註冊" : "登入";
            document.getElementById('nickname').style.display = isSignUp ? "block" : "none";
        }

        async function handleAuth() {
            if (modelLoaded) return; // 模型載入中或已載入，直接返回
            
            try {
                const { error } = isSignUp ? await sb.auth.signUp({ email: document.getElementById('email').value, password: document.getElementById('password').value }) : await sb.auth.signInWithPassword({ email: document.getElementById('email').value, password: document.getElementById('password').value });
                if (error) throw error;
                document.getElementById('ui').style.display = 'none';
                modelLoaded = true; // 認證成功，鎖定載入鎖
                loadModel();
            } catch (err) { alert("登入錯誤: " + err.message); modelLoaded = false; }
        }

        // --- 遊戲邏輯 ---
        function loadModel() {
            const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 100, height: 100}, scene);
            ground.material = new BABYLON.StandardMaterial("gMat", scene);
            ground.material.diffuseColor = new BABYLON.Color3(0.3, 0.6, 0.3);

            // 啟用搖桿 (這會佔據螢幕左半邊觸控區)
            leftJoystick = new BABYLON.VirtualJoystick(true);
            
            BABYLON.SceneLoader.ImportMesh("", "./", "minecraft.glb", scene, (meshes) => {
                player = meshes[0];
                player.scaling = new BABYLON.Vector3(2, 2, 2);
                player.position.y = 0; 
                console.log("模型已載入，搖桿已啟用，相機已對焦");
            });
        }

        // --- 核心修正 3：相機跟隨與移動邏輯 ---
        scene.registerBeforeRender(() => {
            if (player) {
                // 1. 強制讓相機的 alpha 和 beta 與角色的旋轉同步 (保持後上方)
                // Math.PI/2 = 向後，Math.PI/3 = 向上
                camera.alpha = -player.rotation.y + Math.PI / 2;
                camera.beta = Math.PI / 3;

                // 2. 更新攝影機目標位置 (角色上方)
                camera.target = player.position.add(new BABYLON.Vector3(0, 2, 0));

                if (leftJoystick.pressed) {
                    // 根據相機角度計算移動方向 (y=0 強制水平移動)
                    const fwd = camera.getForwardRay().direction;
                    fwd.y = 0; fwd.normalize();
                    const right = BABYLON.Vector3.Cross(fwd, BABYLON.Vector3.Up());

                    const moveX = leftJoystick.deltaPosition.x;
                    const moveY = leftJoystick.deltaPosition.y;

                    const moveSpeed = 0.2;
                    player.position.addInPlace(fwd.scale(-moveY * moveSpeed));
                    player.position.addInPlace(right.scale(moveX * moveSpeed));
                    
                    // 讓角色旋轉至移動方向
                    player.rotation.y = Math.atan2(moveX, -moveY) + Math.PI/2;
                }
            }
        });

        engine.runRenderLoop(() => scene.render());
        window.addEventListener("resize", () => engine.resize());
    </script>
</body>
</html>
