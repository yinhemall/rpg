<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Minecraft RPG 遊戲</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
        canvas { width: 100%; height: 100vh; display: block; }
        #ui { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); background: #222; color: white; padding: 20px; border-radius: 10px; z-index: 10; text-align: center; }
        input { display: block; margin: 10px auto; color: black; padding: 5px; }
        button { cursor: pointer; padding: 10px 20px; margin: 5px; background: #555; color: white; border: none; border-radius: 5px; }
        #debug { position: absolute; top: 10px; left: 10px; color: white; background: red; z-index: 100; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">
        <h3>遊戲帳號管理</h3>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="密碼">
        <input type="text" id="nickname" placeholder="遊戲暱稱">
        <button onclick="handleAction('signIn')">登入</button>
        <button onclick="handleAction('signUp')">註冊</button>
    </div>

    <div id="debug">初始化...</div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.5, 0.5, 0.5, 1); // 灰色背景防隱形
        const debugDiv = document.getElementById("debug");

        const sb = supabase.createClient(
            'https://njxwgiqhlwkybtmbmvto.supabase.co', 
            'sb_publishable_aAhb31EsthrP6PTDOk4dgw_Ww_y-orM',
            { auth: { persistSession: false } }
        );

        async function handleAction(type) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const nickname = document.getElementById('nickname').value;
            let res;
            if (type === 'signUp') {
                res = await sb.auth.signUp({ email, password });
                if (!res.error) alert("註冊成功！");
            } else {
                res = await sb.auth.signInWithPassword({ email, password });
                if (!res.error) {
                    document.getElementById('ui').style.display = 'none';
                    startGame();
                }
            }
            if (res.error) alert("錯誤: " + res.error.message);
        }

        function startGame() {
            debugDiv.innerText = "正在載入模型...";
            
            // 強制光源與地面
            new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
            const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 100, height: 100}, scene);
            const gMat = new BABYLON.StandardMaterial("gMat", scene);
            gMat.diffuseColor = new BABYLON.Color3(0, 1, 0); 
            ground.material = gMat;

            // 攝影機
            const camera = new BABYLON.ArcRotateCamera("cam", 0, Math.PI/4, 50, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);

            // 載入模型
            BABYLON.SceneLoader.ImportMesh("", "./", "minecraft.glb", scene, (meshes) => {
                debugDiv.innerText = "模型已載入，正在顯示...";
                meshes.forEach(m => {
                    m.position = new BABYLON.Vector3(0, 5, 0);
                    m.scaling = new BABYLON.Vector3(5, 5, 5);
                    const mat = new BABYLON.StandardMaterial("mat", scene);
                    mat.emissiveColor = new BABYLON.Color3(1, 0, 0); // 自發光紅色
                    m.material = mat;
                });
            }, null, (s, m) => debugDiv.innerText = "錯誤: " + m);
        }

        engine.runRenderLoop(() => { scene.render(); });
        window.addEventListener("resize", () => engine.resize());
    </script>
</body>
</html>
