<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #111; touch-action: none; font-family: sans-serif; }
        #game-map { width: 100vw; height: 100vh; position: relative; background: #222; }
        #player { width: 40px; height: 40px; background: cyan; position: absolute; left: 100px; top: 100px; transition: 0.05s; }
        
        /* 搖桿底座 */
        #joy-base { width: 120px; height: 120px; background: rgba(255,255,255,0.2); border-radius: 50%; position: fixed; bottom: 50px; left: 50px; }
        /* 搖桿頭 */
        #joy-knob { width: 60px; height: 60px; background: white; border-radius: 50%; position: absolute; left: 30px; top: 30px; }
    </style>
</head>
<body>

<div id="game-map">
    <div id="player"></div>
</div>

<div id="joy-base">
    <div id="joy-knob"></div>
</div>

<script>
    const supabase = supabase.createClient('https://njxwgiqhlwkybtmbmvto.supabase.co', 'sb_publishable_aAhb31EsthrP6PTDOk4dgw_Ww_y-orM');
    
    let px = 100, py = 100;
    let isDragging = false;
    const knob = document.getElementById('joy-knob');

    // 觸控開始
    document.getElementById('joy-base').addEventListener('touchstart', (e) => isDragging = true);
    
    // 觸控移動
    document.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        let touch = e.touches[0];
        let base = document.getElementById('joy-base').getBoundingClientRect();
        
        // 計算搖桿相對位移 (範圍 -30 到 +30)
        let dx = touch.clientX - (base.left + 60);
        let dy = touch.clientY - (base.top + 60);
        let dist = Math.sqrt(dx*dx + dy*dy);
        let angle = Math.atan2(dy, dx);
        
        // 限制搖桿頭不跑出底座
        let limit = Math.min(dist, 30);
        knob.style.left = (30 + Math.cos(angle) * limit) + 'px';
        knob.style.top = (30 + Math.sin(angle) * limit) + 'px';
        
        // 移動玩家 (方向 * 速度)
        px += (dx/30) * 10;
        py += (dy/30) * 10;
        document.getElementById('player').style.left = px + 'px';
        document.getElementById('player').style.top = py + 'px';
    });

    // 觸控結束
    document.addEventListener('touchend', () => {
        isDragging = false;
        knob.style.left = '30px';
        knob.style.top = '30px';
        saveGame();
    });

    async function saveGame() {
        await supabase.from('player_stars').upsert({ id: 'player1', x: Math.floor(px), y: Math.floor(py) });
    }
</script>
</body>
</html>
