<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; touch-action: none; font-family: sans-serif; }
        #renderCanvas { width: 100vw; height: 100vh; display: block; touch-action: none; }
        /* 遊戲風 UI 樣式 */
        .game-ui { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: #e6b873; padding: 25px; border: 6px solid #8b4513; 
            color: #fff; z-index: 999; border-radius: 15px; width: 70%; text-align: center;
            box-shadow: 0 10px 0 #5d2e0a;
        }
        input { display: block; margin: 15px auto; padding: 12px; width: 85%; background: #fff; border: 3px solid #8b4513; border-radius: 8px; color: #333; font-weight: bold; }
        button { 
            padding: 12px 25px; margin: 10px; cursor: pointer;
            background: #ffd700; border: 4px solid #b8860b; border-radius: 10px;
            color: #8b4513; font-weight: bold; font-size: 16px;
            box-shadow: 0 4px 0 #b8860b;
        }
        button:active { transform: translateY(4px); box-shadow: none; }
    </style>
</head>
<body>
    <div id="auth-ui" class="game-ui">
        <h2 id="ui-title" style="color:#8b4513; margin-top:0;">系統登入</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="密碼">
        <input type="text" id="nickname" placeholder="暱稱" style="display:none;">
        <button id="main-btn" onclick="handleAuth()">登入</button>
        <button onclick="toggleMode()">切換註冊/登入</button>
    </div>

    <div id="game-menu" class="game-ui" style="display:none;">
        <h2 style="color:#8b4513;">準備就緒</h2>
        <button onclick="startGame()">進入遊戲</button>
    </div>

    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color3(0.53, 0.81, 0.92);
        
        const light = new BABYLON.HemisphericLight("light1", new BABYLON.Vector3(0, 1, 0), scene);
        light.intensity = 0.8;

        const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/3, 15, BABYLON.Vector3.Zero(), scene);
        camera.lowerRadiusLimit = camera.upperRadiusLimit = 15;
        camera.inputs.remove(camera.inputs.attached.pointers);

        const advancedTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");
        const stickBase = new BABYLON.GUI.Ellipse();
        stickBase.width = "150px"; stickBase.height = "150px";
        stickBase.background = "rgba(255,255,255,0.2)";
        stickBase.horizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
        stickBase.verticalAlignment = BABYLON.GUI.Control.VERTICAL_ALIGNMENT_BOTTOM;
        stickBase.left = 100; stickBase.top = -100;
        stickBase.isVisible = false;
        advancedTexture.addControl(stickBase);

        const stick = new BABYLON.GUI.Ellipse();
        stick.width = "70px"; stick.height = "70px";
        stick.background = "white";
        stickBase.addControl(stick);

        const sb = supabase.createClient('https://njxwgiqhlwkybtmbmvto.supabase.co', 'sb_publishable_aAhb31EsthrP6PTDOk4dgw_Ww_y-orM', { auth: { persistSession: false } });
        let player = null, moveData = { active: false, x: 0, y: 0, id: null }, rotData = { active: false, id: null, lastX: 0 };
        let anims = { walk: null, still: null, current: null };

        function toggleMode() {
            let isSignUp = document.getElementById('nickname').style.display !== 'none';
            document.getElementById('ui-title').innerText = isSignUp ? "系統登入" : "系統註冊";
            document.getElementById('main-btn').innerText = isSignUp ? "登入" : "註冊";
            document.getElementById('nickname').style.display = isSignUp ? "none" : "block";
        }

        async function handleAuth() {
            let isSignUp = document.getElementById('nickname').style.display === 'block';
            try {
                const { error } = isSignUp ? await sb.auth.signUp({ email: document.getElementById('email').value, password: document.getElementById('password').value }) : await sb.auth.signInWithPassword({ email: document.getElementById('email').value, password: document.getElementById('password').value });
                if (error) throw error;
                document.getElementById('auth-ui').style.display = 'none';
                document.getElementById('game-menu').style.display = 'block';
            } catch (err) { alert("失敗: " + err.message); }
        }

        function startGame() {
            document.getElementById('game-menu').style.display = 'none';
            stickBase.isVisible = true;

            for(let x=-10; x<10; x++) {
                for(let z=-10; z<10; z++) {
                    let block = BABYLON.MeshBuilder.CreateBox("b", {size: 1}, scene);
                    block.position = new BABYLON.Vector3(x, -0.5, z);
                    let mat = new BABYLON.StandardMaterial("m", scene);
                    mat.diffuseColor = new BABYLON.Color3(0.2, 0.8, 0.2);
                    block.material = mat;
                }
            }

            BABYLON.SceneLoader.ImportMesh("", "./", "minecraft.glb", scene, (m, ps, ag) => { 
                player = m[0]; 
                player.scaling = new BABYLON.Vector3(2, 2, 2); 
                player.rotationQuaternion = null; 
                player.rotation.y = 0;
                anims.walk = scene.getAnimationGroupByName("walking_test");
                anims.still = scene.getAnimationGroupByName("still_test");
                if (anims.still) { anims.still.start(true); anims.current = "still"; }
            });
        }

        scene.onPointerObservable.add((info) => {
            if (info.type === BABYLON.PointerEventTypes.POINTERDOWN && stickBase.isVisible) {
                if (info.event.clientX < window.innerWidth / 2) { moveData.active = true; moveData.id = info.event.pointerId; }
                else { rotData.active = true; rotData.id = info.event.pointerId; rotData.lastX = info.event.clientX; }
            } else if (info.type === BABYLON.PointerEventTypes.POINTERMOVE) {
                if (moveData.active && info.event.pointerId === moveData.id) {
                    let dx = info.event.clientX - 175, dy = info.event.clientY - (window.innerHeight - 175);
                    let dist = Math.min(Math.sqrt(dx*dx + dy*dy), 50);
                    let angle = Math.atan2(dx, -dy);
                    stick.left = Math.sin(angle) * dist; stick.top = -Math.cos(angle) * dist;
                    moveData.x = Math.sin(angle) * (dist/50); moveData.y = Math.cos(angle) * (dist/50);
                } else if (rotData.active && info.event.pointerId === rotData.id && player) {
                    player.rotation.y += (info.event.clientX - rotData.lastX) * 0.01;
                    rotData.lastX = info.event.clientX;
                }
            } else if (info.type === BABYLON.PointerEventTypes.POINTERUP) {
                if (info.event.pointerId === moveData.id) { moveData.active = false; stick.left = 0; stick.top = 0; moveData.x = 0; moveData.y = 0; }
                if (info.event.pointerId === rotData.id) rotData.active = false;
            }
        });

        scene.registerBeforeRender(() => {
            if (player) {
                camera.target = player.position.clone();
                camera.beta = Math.PI / 3;
                camera.alpha = -player.rotation.y + Math.PI / 2;
                const isMoving = Math.abs(moveData.x) > 0.05 || Math.abs(moveData.y) > 0.05;
                if (isMoving && anims.current !== "walk") {
                    if (anims.still) anims.still.stop();
                    if (anims.walk) anims.walk.start(true);
                    anims.current = "walk";
                } else if (!isMoving && anims.current !== "still") {
                    if (anims.walk) anims.walk.stop();
                    if (anims.still) anims.still.start(true);
                    anims.current = "still";
                }
                const fwd = new BABYLON.Vector3(Math.sin(player.rotation.y), 0, Math.cos(player.rotation.y));
                const rgt = new BABYLON.Vector3(-fwd.z, 0, fwd.x);
                player.position.addInPlace(fwd.scale(-moveData.y * 0.15).add(rgt.scale(moveData.x * 0.15)));
            }
        });

        engine.runRenderLoop(() => scene.render());
        window.addEventListener("resize", () => engine.resize());
    </script>
</body>
</html>
