<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; touch-action: none; }
        #renderCanvas { width: 100vw; height: 100vh; display: block; }
        #ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #111; padding: 20px; border: 1px solid #0ff; color: #fff; z-index: 999; border-radius: 15px; width: 80%; text-align: center; }
        input { display: block; margin: 10px auto; padding: 10px; width: 90%; background: #222; color: #fff; border: 1px solid #444; }
        button { padding: 10px 20px; margin: 5px; color: #0ff; background: transparent; border: 1px solid #0ff; }
        #debug { position: absolute; top: 10px; left: 10px; color: yellow; z-index: 1000; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">
        <h3 id="ui-title">系統登入</h3>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="密碼">
        <input type="text" id="nickname" placeholder="暱稱" style="display:none;">
        <button id="main-btn" onclick="handleAuth()">登入</button>
        <button onclick="toggleMode()">切換註冊/登入</button>
    </div>
    <div id="debug"></div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        const sb = supabase.createClient('https://njxwgiqhlwkybtmbmvto.supabase.co', 'sb_publishable_aAhb31EsthrP6PTDOk4dgw_Ww_y-orM', { auth: { persistSession: false } });
        
        const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/4, 15, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);
        new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

        let player = null, moveState = { active: false, x: 0, y: 0 };

        // --- 登入系統邏輯 ---
        function toggleMode() {
            let isSignUp = document.getElementById('nickname').style.display !== 'none';
            document.getElementById('ui-title').innerText = isSignUp ? "系統登入" : "系統註冊";
            document.getElementById('main-btn').innerText = isSignUp ? "登入" : "註冊";
            document.getElementById('nickname').style.display = isSignUp ? "none" : "block";
        }

        async function handleAuth() {
            try {
                let isSignUp = document.getElementById('nickname').style.display === 'block';
                const { error } = isSignUp ? await sb.auth.signUp({ email: document.getElementById('email').value, password: document.getElementById('password').value }) : await sb.auth.signInWithPassword({ email: document.getElementById('email').value, password: document.getElementById('password').value });
                if (error) throw error;
                document.getElementById('ui').style.display = 'none';
                loadModel();
            } catch (err) { alert("登入錯誤: " + err.message); }
        }

        // --- 遊戲邏輯 ---
        function loadModel() {
            BABYLON.MeshBuilder.CreateGround("ground", {width: 100, height: 100}, scene);
            BABYLON.SceneLoader.ImportMesh("", "./", "minecraft.glb", scene, (meshes) => {
                player = meshes[0];
                player.scaling = new BABYLON.Vector3(2, 2, 2);
            });
        }

        // 觸控分區監聽 (左邊移動，右邊轉視角)
        scene.onPointerObservable.add((info) => {
            if (info.type === BABYLON.PointerEventTypes.POINTERDOWN) {
                if (info.event.clientX < window.innerWidth / 2) moveState.active = true;
            } else if (info.type === BABYLON.PointerEventTypes.POINTERMOVE && moveState.active) {
                moveState.x = (info.event.clientX / (window.innerWidth / 4)) - 1;
                moveState.y = (info.event.clientY / (window.innerHeight / 2)) - 1;
            } else if (info.type === BABYLON.PointerEventTypes.POINTERUP) {
                moveState.active = false;
            }
        });

        scene.registerBeforeRender(() => {
            if (player) {
                camera.target = BABYLON.Vector3.Lerp(camera.target, player.position.add(new BABYLON.Vector3(0, 1, 0)), 0.1);
                if (moveState.active) {
                    const fwd = camera.getForwardRay().direction; fwd.y = 0; fwd.normalize();
                    const right = BABYLON.Vector3.Cross(fwd, BABYLON.Vector3.Up());
                    player.position.addInPlace(fwd.scale(-moveState.y * 0.2));
                    player.position.addInPlace(right.scale(moveState.x * 0.2));
                    player.rotation.y = Math.atan2(moveState.x, -moveState.y) + camera.alpha + Math.PI/2;
                }
            }
        });

        engine.runRenderLoop(() => scene.render());
        window.addEventListener("resize", () => engine.resize());
    </script>
</body>
</html>
