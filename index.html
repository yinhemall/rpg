<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
    <canvas id="renderCanvas" style="width:100%; height:100vh;"></canvas>
    <div id="errorLog" style="position:absolute; top:10px; left:10px; color:red; background:white;"></div>
    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        new BABYLON.ArcRotateCamera("cam", 0, 1, 5, BABYLON.Vector3.Zero(), scene).attachControl(canvas, true);
        new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

        // 載入模型並顯示詳細錯誤
        BABYLON.SceneLoader.ImportMesh("", "", "minecraft.glb", scene, 
            (meshes) => {
                document.getElementById("errorLog").innerText = "模型載入成功！";
            },
            null,
            (scene, message) => {
                document.getElementById("errorLog").innerText = "錯誤: " + message;
                console.error(message);
            }
        );

        engine.runRenderLoop(() => scene.render());
    </script>
</body>
</html>
