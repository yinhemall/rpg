<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>My Game</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body, canvas { width: 100%; height: 100vh; margin: 0; padding: 0; overflow: hidden; touch-action: none; }
        #ui { position: absolute; top: 10px; left: 10px; color: #fff; background: rgba(0,0,0,0.5); padding: 10px; z-index: 999; }
    </style>
</head>
<body>
    <div id="ui">啟動中...</div>
    <canvas id="renderCanvas"></canvas>
    <script>
        const ui = document.getElementById('ui');
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        
        const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/3, 5, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, false);
        new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

        // 已幫你填入正確的 Publishable key
        const sbClient = supabase.createClient(
            'https://njxwgiqhlwkybtmbmvto.supabase.co', 
            'Sb_publishable_aAhb31EsthrP6PTDOk4dgw_Ww_y-orM'
        );

        const joystick = new BABYLON.VirtualJoystick(true);
        let player = null;

        BABYLON.SceneLoader.ImportMesh("", "./", "minecraft.glb", scene, (meshes) => {
            player = meshes[0];
            ui.innerText = "成功連線！推動搖桿移動";
        });

        scene.registerBeforeRender(() => {
            if (player && joystick.pressed) {
                player.position.x += joystick.deltaPosition.x * 0.05;
                player.position.z += joystick.deltaPosition.y * 0.05;

                sbClient.from('player_stars').upsert({ id: 'player1', x: player.position.x, z: player.position.z })
                .then(res => { 
                    if(res.error) ui.innerText = "存檔失敗: " + res.error.message; 
                    else ui.innerText = "遊戲運行中...";
                });
            }
        });

        engine.runRenderLoop(() => scene.render());
    </script>
</body>
</html>
