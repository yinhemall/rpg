<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Minecraft RPG 遊戲</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
        canvas { width: 100%; height: 100vh; display: block; }
        #ui { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); background: #222; color: white; padding: 20px; border-radius: 10px; z-index: 10; text-align: center; }
        input { display: block; margin: 10px auto; color: black; padding: 5px; }
        button { cursor: pointer; padding: 10px 20px; margin: 5px; background: #555; color: white; border: none; border-radius: 5px; }
        #debug { position: absolute; top: 10px; left: 10px; color: white; background: blue; z-index: 100; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">
        <h3>遊戲帳號管理</h3>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="密碼">
        <button onclick="handleAction('signIn')">登入</button>
        <button onclick="handleAction('signUp')">註冊</button>
    </div>

    <div id="debug">準備就緒</div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.1, 0.1, 0.1, 1);

        const sb = supabase.createClient(
            'https://njxwgiqhlwkybtmbmvto.supabase.co', 
            'sb_publishable_aAhb31EsthrP6PTDOk4dgw_Ww_y-orM',
            { auth: { persistSession: false } }
        );

        let player; // 定義全域角色變數
        const camera = new BABYLON.ArcRotateCamera("cam", 0, Math.PI/4, 20, BABYLON.Vector3.Zero(), scene);
        camera.attachControl(canvas, true);

        async function handleAction(type) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            let res = type === 'signUp' ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
            if (!res.error) {
                document.getElementById('ui').style.display = 'none';
                startGame();
            } else { alert("錯誤: " + res.error.message); }
        }

        const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
        const ground = BABYLON.MeshBuilder.CreateGround("ground", {width: 100, height: 100}, scene);
        ground.material = new BABYLON.StandardMaterial("gMat", scene);
        ground.material.diffuseColor = new BABYLON.Color3(0, 0.5, 0);

        function startGame() {
            document.getElementById("debug").innerText = "模型載入中...";
            BABYLON.SceneLoader.ImportMesh("", "./", "minecraft.glb", scene, (meshes) => {
                document.getElementById("debug").innerText = "角色已生成 (WASD移動)";
                player = meshes[0]; // 假設第一個網格為根節點
                player.scaling = new BABYLON.Vector3(2, 2, 2);
                player.position = new BABYLON.Vector3(0, 0.5, 0); // 貼地高度
                camera.lockedTarget = player; // 【攝影機追隨】
            });

            // 【移動邏輯】
            let inputMap = {};
            scene.actionManager = new BABYLON.ActionManager(scene);
            scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyDownTrigger, evt => inputMap[evt.sourceEvent.key] = true));
            scene.actionManager.registerAction(new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnKeyUpTrigger, evt => inputMap[evt.sourceEvent.key] = false));

            scene.onBeforeRenderObservable.add(() => {
                if (!player) return;
                const speed = 0.2;
                if (inputMap["w"]) player.position.z += speed;
                if (inputMap["s"]) player.position.z -= speed;
                if (inputMap["a"]) player.position.x -= speed;
                if (inputMap["d"]) player.position.x += speed;
            });
        }

        engine.runRenderLoop(() => { scene.render(); });
        window.addEventListener("resize", () => engine.resize());
    </script>
</body>
</html>
