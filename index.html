<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; touch-action: none; }
        #renderCanvas { width: 100vw; height: 100vh; display: block; }
        #ui { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #111; padding: 20px; border: 1px solid #0ff; color: #fff; z-index: 999; border-radius: 15px; width: 80%; text-align: center; }
        #debug { position: absolute; top: 10px; left: 10px; color: yellow; z-index: 1000; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">
        <h3 id="ui-title">系統登入</h3>
        <input type="email" id="email" placeholder="Email"><br>
        <input type="password" id="password" placeholder="密碼"><br>
        <input type="text" id="nickname" placeholder="暱稱" style="display:none;"><br>
        <button id="main-btn" onclick="handleAuth()">登入</button>
        <button onclick="toggleMode()">切換註冊/登入</button>
    </div>
    <div id="debug"></div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);
        const scene = new BABYLON.Scene(engine);
        const debug = document.getElementById('debug');
        
        // 攝影機初始化：先預設對焦到原點
        const camera = new BABYLON.ArcRotateCamera("cam", -Math.PI/2, Math.PI/4, 15, new BABYLON.Vector3(0, 0, 0), scene);
        camera.attachControl(canvas, true);
        const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);

        const sb = supabase.createClient('https://njxwgiqhlwkybtmbmvto.supabase.co', 'sb_publishable_aAhb31EsthrP6PTDOk4dgw_Ww_y-orM', { auth: { persistSession: false } });
        let player = null, isLoaded = false, moveInput = { active: false, x: 0, y: 0 };

        function toggleMode() {
            let isSignUp = document.getElementById('nickname').style.display !== 'none';
            document.getElementById('ui-title').innerText = isSignUp ? "系統登入" : "系統註冊";
            document.getElementById('main-btn').innerText = isSignUp ? "登入" : "註冊";
            document.getElementById('nickname').style.display = isSignUp ? "none" : "block";
        }

        async function handleAuth() {
            try {
                let isSignUp = document.getElementById('nickname').style.display === 'block';
                const { error } = isSignUp ? await sb.auth.signUp({ email: document.getElementById('email').value, password: document.getElementById('password').value }) : await sb.auth.signInWithPassword({ email: document.getElementById('email').value, password: document.getElementById('password').value });
                if (error) throw error;
                document.getElementById('ui').style.display = 'none';
                loadModel();
            } catch (err) { debug.innerText = "登入失敗: " + err.message; }
        }

        function loadModel() {
            if (isLoaded) return;
            isLoaded = true;
            debug.innerText = "載入中...";
            BABYLON.MeshBuilder.CreateGround("ground", {width: 100, height: 100}, scene);
            
            BABYLON.SceneLoader.ImportMesh("", "./", "minecraft.glb", scene, (meshes) => {
                player = meshes[0];
                player.scaling = new BABYLON.Vector3(2, 2, 2);
                debug.innerText = "載入成功";
            }, null, (s, m) => { debug.innerText = "模型錯誤: " + m; });
        }

        scene.onPointerObservable.add((info) => {
            if (info.type === BABYLON.PointerEventTypes.POINTERDOWN) {
                if (info.event.clientX < window.innerWidth / 2) moveInput.active = true;
            } else if (info.type === BABYLON.PointerEventTypes.POINTERMOVE && moveInput.active) {
                moveInput.x = (info.event.clientX / (window.innerWidth / 4) - 1);
                moveInput.y = (info.event.clientY / (window.innerHeight / 2) - 1);
            } else if (info.type === BABYLON.PointerEventTypes.POINTERUP) {
                moveInput.active = false;
            }
        });

        scene.registerBeforeRender(() => {
            if (player) {
                // 平滑追蹤
                camera.target = BABYLON.Vector3.Lerp(camera.target, player.position.add(new BABYLON.Vector3(0, 1.5, 0)), 0.1);
                
                if (moveInput.active) {
                    const fwd = camera.getForwardRay().direction; fwd.y = 0; fwd.normalize();
                    const right = BABYLON.Vector3.Cross(fwd, BABYLON.Vector3.Up());
                    player.position.addInPlace(fwd.scale(-moveInput.y * 0.2));
                    player.position.addInPlace(right.scale(moveInput.x * 0.2));
                    player.rotation.y = Math.atan2(moveInput.x, -moveInput.y) + camera.alpha + Math.PI/2;
                }
            }
        });

        engine.runRenderLoop(() => scene.render());
        window.addEventListener("resize", () => engine.resize());
    </script>
</body>
</html>
