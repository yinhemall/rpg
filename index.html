<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #111; color: white; text-align: center; font-family: sans-serif; }
        #game-view { position: relative; width: 400px; height: 400px; margin: auto; border: 4px solid #fff; overflow: hidden; }
        #map, #battle { width: 100%; height: 100%; position: absolute; }
        #battle { background: #222; display: none; }
        #player { width: 40px; height: 40px; background: cyan; position: absolute; }
        .btn { padding: 10px 20px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div id="game-view">
    <div id="map" onclick="movePlayer(event)">
        <div id="player"></div>
        <div style="width:40px;height:40px;background:red;position:absolute;left:240px;top:240px;"></div>
    </div>

    <div id="battle">
        <h2>戰鬥中！</h2>
        <div id="monster-img" style="font-size:60px;" onclick="hit()">👹</div>
        <p>怪物 HP: <span id="m-hp">100</span></p>
        <button class="btn" onclick="backToMap()">逃跑</button>
    </div>
</div>

<script>
    let gameState = "map"; // 狀態：map 或 battle
    let mHp = 100;

    // --- 地圖移動邏輯 ---
    function movePlayer(e) {
        if(gameState !== "map") return;
        let x = Math.floor(e.offsetX / 40) * 40;
        let y = Math.floor(e.offsetY / 40) * 40;
        document.getElementById('player').style.left = x + 'px';
        document.getElementById('player').style.top = y + 'px';

        if(x === 240 && y === 240) {
            document.getElementById('map').style.display = "none";
            document.getElementById('battle').style.display = "block";
            gameState = "battle";
        }
    }

    // --- 戰鬥邏輯 ---
    function hit() {
        mHp -= 20;
        document.getElementById('m-hp').innerText = mHp;
        if(mHp <= 0) {
            alert("獲勝！獲得金幣！");
            backToMap();
        }
    }

    function backToMap() {
        document.getElementById('map').style.display = "block";
        document.getElementById('battle').style.display = "none";
        gameState = "map";
        mHp = 100; // 重置怪物血量
        document.getElementById('m-hp').innerText = 100;
    }
</script>
</body>
</html>
